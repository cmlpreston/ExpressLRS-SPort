; ExpressLRS PlatformIO Project Configuration File

[platformio]
extra_configs =
	# keep common first
	targets/common.ini
	targets/esp32-tx.ini
	targets/esp32s3-tx.ini
	targets/esp32c3-tx.ini
	targets/esp8285-tx.ini
	targets/esp32-rx.ini
	targets/esp32s3-rx.ini
	targets/esp32c3-rx.ini
	targets/esp8285-rx.ini

# ------------------------- TARGET ENV DEFINITIONS -----------------

[env:native]
platform = native
framework =
test_ignore = test_embedded
lib_ignore = BUTTON, DAC, LQCALC, LBT, SPIEx, PWM, WIFI, TCPSOCKET, LR1121Driver, SX127xDriver
build_src_filter = ${common_env_data.build_src_filter} -<ESP32*.*> -<ESP8*.*> -<tx_*.cpp> -<rx_*.cpp> -<common.*> -<config.*>
build_flags =
	-std=c++11
	-Iinclude
	-D PROGMEM=""
	-D UNIT_TEST=1
	-D TARGET_NATIVE

[env:ER4_ESP8285_2400_RX_SPORT_BUILD]
extends = env:Unified_ESP8285_2400_RX_via_UART
board_config = radiomaster.rx_2400.er4
build_flags =
    ${env:Unified_ESP8285_2400_RX_via_UART.build_flags}
    -DER4_SPORT_TRIAL=1
    -DSPORT_CELLS_PHYSICAL_ID=0xa1
    -DSPORT_CELLS_APP_ID=0x0300
    -DSPORT_TEMP_PHYSICAL_ID=0x22
    -DSPORT_TEMP_APP_ID=0x0400
    -DSPORT_FAS_PHYSICAL_ID=0x22

[env:ER4_ESP8285_2400_RX_SPORT_via_WIFI]
extends = env:ER4_ESP8285_2400_RX_SPORT_BUILD

[env:ER6G_ESP32_2400_RX_SPORT_via_WIFI]
extends = env:ER6G_ESP32_2400_RX_SPORT_BUILD

[env:ER6G_ESP32_2400_RX_SPORT_BUILD]
extends = env:Unified_ESP32_2400_RX_via_UART
board_config = radiomaster.rx_2400.er6g
build_flags =
    ${env:Unified_ESP32_2400_RX_via_UART.build_flags}
    -DER6G_SPORT_TRIAL=1
    -DSPORT_CELLS_PHYSICAL_ID=0xa1
    -DSPORT_CELLS_APP_ID=0x0300
    -DSPORT_TEMP_PHYSICAL_ID=0x22
    -DSPORT_TEMP_APP_ID=0x0400
    -DSPORT_FAS_PHYSICAL_ID=0x22
